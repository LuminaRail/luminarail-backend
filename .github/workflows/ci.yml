name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: luminarail
          POSTGRES_PASSWORD: luminarail_ci_password
          POSTGRES_DB: luminarail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run Prisma migrations in CI
        env:
          DATABASE_URL: postgresql://luminarail:luminarail_ci_password@localhost:5432/luminarail_test?schema=public
        run: npx prisma migrate deploy

      - name: Run type check
        run: npm run type-check

      - name: Run linter
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        env:
          DATABASE_URL: postgresql://luminarail:luminarail_ci_password@localhost:5432/luminarail_test?schema=public
          JWT_SECRET: ci_jwt_secret_key_12345
        run: npm test
