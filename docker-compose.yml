services:
  postgres:
    image: postgres:16-alpine
    container_name: luminarail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-luminarail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luminarail}
      POSTGRES_DB: ${POSTGRES_DB:-luminarail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
