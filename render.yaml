# Render Blueprint Specification for LuminaRail Production Settlement Infrastructure
services:
  # Web API Service (Express HTTP Server)
  - type: web
    name: luminarail-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: luminarail-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: luminarail-redis
          property: connectionString
      - key: STELLAR_NETWORK
        value: public
      - key: STELLAR_USDC_ISSUER
        value: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
      - key: STELLAR_USDC_CONTRACT_ID
        value: CCW67TSZV3SSS2HXMBQ5JFGCKJNXKZM7UQUWUZPUTHXSTZLEO7SJMI75
      - key: STELLAR_HORIZON_URL
        value: https://horizon.stellar.org
      - key: STELLAR_SOROBAN_RPC_URL
        value: https://soroban-rpc.mainnet.stellar.org
      - key: STELLAR_SIGNER_PROVIDER
        value: aws_kms
      - key: STELLAR_KMS_KEY_ARN
        sync: false
      - key: STELLAR_SETTLEMENT_SIGNER_PUBLIC_KEY
        sync: false
      - key: STELLAR_CONTRACT_ADMIN_GOVERNANCE_TYPE
        value: multisig
      - key: STELLAR_CONTRACT_ADMIN_ADDRESS
        sync: false
      - key: NGN_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PRODUCTION_SETTLEMENT_ENABLED
        value: "true"
      - key: REQUIRE_DISTRIBUTED_LOCKS
        value: "true"
      - key: STELLAR_DISTRIBUTED_LOCK_FAIL_CLOSED
        value: "true"
      - key: TREASURY_WARN_THRESHOLD_USDC
        value: "50000"
      - key: TREASURY_CRITICAL_THRESHOLD_USDC
        value: "10000"

  # Background Worker Service (SettlementWorker, ReservationCleanupWorker, ReconciliationDaemon)
  - type: worker
    name: luminarail-worker
    env: node
    region: oregon
    plan: starter
    buildCommand: npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luminarail-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: luminarail-redis
          property: connectionString
      - key: STELLAR_NETWORK
        value: public
      - key: STELLAR_USDC_ISSUER
        value: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
      - key: STELLAR_USDC_CONTRACT_ID
        value: CCW67TSZV3SSS2HXMBQ5JFGCKJNXKZM7UQUWUZPUTHXSTZLEO7SJMI75
      - key: STELLAR_HORIZON_URL
        value: https://horizon.stellar.org
      - key: STELLAR_SOROBAN_RPC_URL
        value: https://soroban-rpc.mainnet.stellar.org
      - key: STELLAR_SIGNER_PROVIDER
        value: aws_kms
      - key: STELLAR_KMS_KEY_ARN
        sync: false
      - key: STELLAR_SETTLEMENT_SIGNER_PUBLIC_KEY
        sync: false
      - key: STELLAR_CONTRACT_ADMIN_GOVERNANCE_TYPE
        value: multisig
      - key: STELLAR_CONTRACT_ADMIN_ADDRESS
        sync: false
      - key: NGN_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PRODUCTION_SETTLEMENT_ENABLED
        value: "true"
      - key: REQUIRE_DISTRIBUTED_LOCKS
        value: "true"
      - key: STELLAR_DISTRIBUTED_LOCK_FAIL_CLOSED
        value: "true"
      - key: TREASURY_WARN_THRESHOLD_USDC
        value: "50000"
      - key: TREASURY_CRITICAL_THRESHOLD_USDC
        value: "10000"

databases:
  - name: luminarail-db
    databaseName: luminarail
    user: luminarail_user
    region: oregon
    plan: starter
